name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Set version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Build frontend
        run: npm ci
        working-directory: frontend

      - name: Build Windows binary
        run: |
          wails build -platform windows/amd64 -skipbindings -ldflags "-X main.Version=${{ env.VERSION }}"
          mv build/bin/PoiFlow.exe "build/bin/PoiFlow-${{ env.VERSION }}-windows-amd64.exe"
        env:
          CGO_ENABLED: "0"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/bin/PoiFlow-*-windows-amd64.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Set version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Build frontend
        run: npm ci
        working-directory: frontend

      - name: Build macOS app
        run: |
          wails build -platform darwin/universal -skipbindings -ldflags "-X main.Version=${{ env.VERSION }}"
          ditto -c -k --sequesterRsrc --keepParent \
            build/bin/PoiFlow.app \
            "build/bin/PoiFlow-${{ env.VERSION }}-macos-universal.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: build/bin/PoiFlow-*-macos-universal.zip

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: assets/**
          generate_release_notes: true
